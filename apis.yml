- aid: circle-community:circle-community-realtime-websocket-api
  name: Circle Realtime WebSocket API
  tags:
  - WebSocket
  - Real-Time
  - Chat
  - Notification
  - ActionCable
  tags_raw:
  - WebSocket
  - Realtime
  - Chat
  - Notifications
  - ActionCable
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api.circle.so/get-started/websockets-beta
  baseURL: wss://app.circle.so/cable
  properties:
  - url: https://api.circle.so/get-started/websockets-beta
    type: Documentation
  - url: asyncapi/circle-community-asyncapi.yml
    type: AsyncAPI
  description: >-
    Beta ActionCable (Rails) WebSocket surface for realtime chat and notifications, connected at wss://app.circle.so/cable
    with a member Bearer access token and a whitelisted Origin header. Exposes a NotificationChannel (new-notification
    and unread-count events) and three chat channels for member-level room updates, room-wide messages,
    and thread events.
